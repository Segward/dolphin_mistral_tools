[project]
name = "dolphin_mistral_tools"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "ollama>=0.6.3",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "Darwin"

[tool.ruff.lint.isort]
known-first-party = ["main", "model", "tools"]

[project.scripts]
model = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
